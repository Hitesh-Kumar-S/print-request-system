<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - PrintFlow</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">

    <style>

        .dashboard-container {
            width: 90%;
            max-width: 700px;
            margin: 80px auto;
            text-align: center;
        }

        .dashboard-card {
            padding: 30px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .dashboard-card h1 {
            margin-bottom: 10px;
        }

        .dashboard-card p {
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .dashboard-btn {
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-btn {
            margin-top: 20px;
        }

    </style>
</head>
<body>

<button class="toggle-btn"
        onclick="toggleDarkMode()"
        id="toggle-icon">🌙</button>

<div class="dashboard-container">

    <div class="dashboard-card">

        <h1>🛠️ Admin Dashboard</h1>

        <p>Manage and monitor all print requests</p>

        <!-- View All Requests -->
        <button class="dashboard-btn"
                onclick="window.location.href='/admin/all-requests'">

            View All Requests
        </button>

        <!-- Pending Requests -->
        <button class="dashboard-btn"
        onclick="window.location.href='/admin/pending-requests'">

    Pending Requests
</button>

        <button class="dashboard-btn"
        onclick="window.location.href='/admin/approved-requests'">

    Approved Requests
</button>

        <button class="dashboard-btn"
        onclick="window.location.href='/admin/payment-requests'">

    Payment Requests
</button>

        <!-- Logout -->
        <form th:action="@{/logout}" method="post">

            <button type="submit"
                    class="dashboard-btn logout-btn">

                Logout
            </button>

        </form>

    </div>

</div>

<script src="/theme.js"></script>

</body>
</html>
