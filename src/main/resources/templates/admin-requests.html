<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>All Print Requests</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

    <style>

        .container {
            width: 95%;
            max-width: 1300px;
            margin: 40px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ccc;
            text-align: center;
        }

        th {
            font-weight: 600;
        }

        .status {
            font-weight: 600;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 3px;
        }

    </style>

</head>
<body>

<button class="toggle-btn"
        onclick="toggleDarkMode()"
        id="toggle-icon">🌙</button>

<div class="container">

    <h2>🛠️ All Print Requests</h2>

    <p th:if="${filterError}"
   th:text="${filterError}"

   style="
        color:#ff4d4d;
        font-weight:600;
        margin-top:10px;">
</p>

    <!-- SEARCH + VIEW ALL -->
    <div style="margin: 20px 0;">

        <form th:action="@{/admin/search}"
              method="get"
              style="display:flex;
                     gap:10px;
                     align-items:center;
                     flex-wrap:wrap;">

            <input type="text"
                   name="keyword"
                   placeholder="Search by user email"
                   style="padding:10px;
                          width:250px;
                          border-radius:8px;
                          border:1px solid #ccc;">

            <button type="submit">
                🔍 Search
            </button>

            <!-- View All Requests -->
            <a th:href="@{/admin/all-requests}"
               style="
                    text-decoration:none;
                    font-weight:600;
                    padding:10px 14px;
                    border-radius:8px;
                    border:1px solid #ccc;">

                📋 View All Requests
            </a>

        </form>

    </div>

    <!-- FILTER SECTION -->
    <div style="
            display:flex;
            gap:15px;
            flex-wrap:wrap;
            margin-bottom:20px;">

        <!-- STATUS FILTER -->
        <form th:action="@{/admin/filter}"
              method="get">

            <select name="status"
                    style="
                        padding:10px;
                        border-radius:8px;
                        border:1px solid #ccc;">

                <option value="">
                    -- Filter By Status --
                </option>

                <option value="PENDING">
                    PENDING
                </option>

                <option value="APPROVED">
                    APPROVED
                </option>

                <option value="COMPLETED">
                    COMPLETED
                </option>

                <option value="REJECTED">
                    REJECTED
                </option>

            </select>

            <button type="submit">
                🎯 Filter
            </button>

        </form>

        <!-- PAYMENT FILTER -->
        <form th:action="@{/admin/payment-filter}"
              method="get">

            <select name="paymentStatus"
                    style="
                        padding:10px;
                        border-radius:8px;
                        border:1px solid #ccc;">

                <option value="">
                    -- Filter By Payment --
                </option>

                <option value="PAID">
                    PAID
                </option>

                <option value="UNPAID">
                    UNPAID
                </option>

            </select>

            <button type="submit">
                💰 Filter Payment
            </button>

        </form>

    </div>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>User</th>
            <th>Document</th>
            <th>Pages</th>
            <th>Copies</th>
            <th>Amount</th>
            <th>Created At</th>
            <th>Status</th>
            <th>Payment</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="request : ${requests}">

            <td th:text="${request.id}"></td>

            <td th:text="${request.user.email}"></td>

            <td th:text="${request.documentName}"></td>

            <td th:text="${request.pages}"></td>

            <td th:text="${request.copies}"></td>

            <td th:text="${request.amount}"></td>

            <td th:text="${#temporals.format(
                    request.createdAt,
                    'dd MMM yyyy, hh:mm a')}">
            </td>

            <td>

    <span class="badge"
          th:classappend="

            ${request.status.name() == 'PENDING'} ? ' badge-pending' :

            (${request.status.name() == 'APPROVED'} ? ' badge-approved' :

            (${request.status.name() == 'REJECTED'} ? ' badge-rejected' :

            ' badge-completed'))"

          th:text="${request.status}">
    </span>

</td>

            <td>

    <span class="badge"
          th:classappend="

            ${request.paymentStatus.name() == 'PAID'} ?

            ' badge-paid' :

            ' badge-unpaid'"

          th:text="${request.paymentStatus}">
    </span>

</td>

        </tr>

        </tbody>

    </table>

    <!-- PAGINATION -->

    <!-- PAGINATION -->
<div th:if="${currentPage != null and totalPages != null}"

     style="
            margin-top:30px;
            display:flex;
            gap:10px;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;">

        <!-- Previous -->
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/all-requests(page=${currentPage - 1})}"
           style="
                padding:10px 14px;
                border:1px solid #ccc;
                border-radius:8px;
                text-decoration:none;">

            ⬅ Previous
        </a>

        <!-- Page Numbers -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

            <a th:href="@{/admin/all-requests(page=${i})}"

               th:text="${i + 1}"

               th:style="${i == currentPage}
               ? 'padding:10px 14px;
                  background:#4B7BE5;
                  color:white;
                  border-radius:8px;
                  text-decoration:none;'

               : 'padding:10px 14px;
                  border:1px solid #ccc;
                  border-radius:8px;
                  text-decoration:none;'">
            </a>

        </span>

        <!-- Next -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/all-requests(page=${currentPage + 1})}"
           style="
                padding:10px 14px;
                border:1px solid #ccc;
                border-radius:8px;
                text-decoration:none;">

            Next ➡
        </a>

    </div>

    <br>

    <a th:href="@{/admin/dashboard}">
        ⬅ Back to Dashboard
    </a>

</div>

<script src="/theme.js"></script>

</body>
</html>
