<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Approved Requests</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

    <style>

        .container {
            width: 95%;
            max-width: 1300px;
            margin: 40px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ccc;
            text-align: center;
        }

        th {
            font-weight: 600;
        }

        .action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            margin: 5px;
            display: inline-block;
        }

    </style>

</head>
<body>

<button class="toggle-btn"
        onclick="toggleDarkMode()"
        id="toggle-icon">🌙</button>

<div class="container">

    <h2>Approved Print Requests</h2>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>User</th>
            <th>Document</th>
            <th>Pages</th>
            <th>Copies</th>
            <th>Amount</th>
            <th>Payment</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="request : ${requests}">

            <td th:text="${request.id}"></td>

            <td th:text="${request.user.email}"></td>

            <td th:text="${request.documentName}"></td>

            <td th:text="${request.pages}"></td>

            <td th:text="${request.copies}"></td>

            <td th:text="${request.amount}"></td>

            <td>

    <span class="badge"
          th:classappend="

            ${request.paymentStatus.name() == 'PAID'} ?

            ' badge-paid' :

            ' badge-unpaid'"

          th:text="${request.paymentStatus}">
    </span>

</td>

            <td>

    <!-- Complete -->
    <a th:href="@{'/admin/complete/' + ${request.id}}"
       class="action-btn btn-complete">

        Complete

    </a>

</td>

        </tr>

        </tbody>

    </table>

    <br>

    <form th:action="@{/admin/dashboard}" method="get">
    <button type="submit" class="small-btn btn-blue">
        Back to Dashboard
    </button>
</form>

</div>

<script src="/theme.js"></script>

</body>
</html>
