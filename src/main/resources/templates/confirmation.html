<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Request Confirmation</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 🌙 Dark Mode Toggle Button -->
<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">
    <h2>✅ Request Submitted Successfully</h2>

    <div class="welcome-message">
        <p>Your print request has been recorded.</p>
        <p>Thank you for using our service!</p>
        <p>Please hand over the payment when collecting your document.</p>
    </div>

    <!-- ⏰ Time & Date -->
    <div class="time-display">
        <p id="current-date"></p>
        <p id="current-time"></p>
    </div>

    <!-- 🔁 Action Button -->
    <form th:action="@{/request}" method="get">
        <button type="submit">Make Another Request</button>
    </form>

    <div class="thank-you-note">
        <p>We appreciate your trust 🙌</p>
    </div>
</div>

<!-- 🔗 JS -->
<script src="/theme.js"></script>

</body>
</html>
