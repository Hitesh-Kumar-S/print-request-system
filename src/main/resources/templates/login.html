<!DOCTYPE html>
<html>
<head>
    <title>Login - Print App</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">

    <h2>🔐 Login</h2>

    <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
    </form>

    <!-- ✅ Message display -->
    <p id="message" style="text-align:center; margin-top:10px;"></p>

    <div class="thank-you-note">
        <p>New user? <a href="/signup">Sign Up</a></p>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const user = {
        email: email.value,
        password: password.value
    };

    const res = await fetch("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(user)
    });

    const messageEl = document.getElementById("message");

    if (res.ok) {
        const token = await res.text();

        // 🔐 Store token
        localStorage.setItem("token", token);

        messageEl.style.color = "green";
        messageEl.innerText = "Login successful!";

        setTimeout(() => {
            window.location.href = "/request";
        }, 1000);

    } else {
        messageEl.style.color = "red";
        messageEl.innerText = "Invalid email or password ❌";
    }
});
</script>

<script src="/theme.js"></script>

</body>
</html>
