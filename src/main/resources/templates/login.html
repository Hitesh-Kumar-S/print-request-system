<!DOCTYPE html>
<html>
<head>

    <title>Login - PrintFlow</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">

</head>
<body>

<!-- 🌙 Dark Mode -->
<button class="toggle-btn"
        onclick="toggleDarkMode()"
        id="toggle-icon">🌙</button>

<div class="form-container">

    <h2>Login</h2>

    <!-- INFO MESSAGE -->
    <div class="info-box">

        Please use a valid email address while logging in.

        <br><br>

        All request updates and notifications
        will be sent to your registered email.

    </div>

    <!-- Spring Security Login Form -->
    <form method="POST"
          action="/perform_login">

        <!-- Email -->
        <label>Email</label>

        <input type="email"
               name="username"
               required>

        <!-- Password -->
        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="password" required>
            <span class="toggle-password" id="togglePasswordText" onclick="togglePassword()">Show</span>
        </div>

        <button type="submit">

            Login

        </button>

    </form>

    <!-- Messages -->
    <div class="thank-you-note">

        <!-- Invalid Login -->
        <p th:if="${param.error}"
           style="color:red;">

            Invalid email or password

        </p>

        <!-- Logout -->
        <p th:if="${param.logout}"
           style="color:green;">

            Logged out successfully

        </p>

        <!-- Signup -->
        <p>

            New user?

            <a href="/signup">

                Sign Up

            </a>

        </p>

    </div>

</div>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleText = document.getElementById("togglePasswordText");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleText.textContent = "Hide";
        } else {
            passwordField.type = "password";
            toggleText.textContent = "Show";
        }
    }
</script>


<script src="/theme.js"></script>

</body>
</html>
