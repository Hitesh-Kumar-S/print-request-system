<!DOCTYPE html>
<html>
<head>
    <title>Login - Print App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">

    <h2>🔐 Login</h2>

    <!-- Spring Security Login Form -->
    <form method="POST" action="/perform_login">

        <!-- IMPORTANT: name="username" -->
        <label>Email</label>
        <input type="email"
               name="username"
               required>

        <!-- IMPORTANT: name="password" -->
        <label>Password</label>
        <input type="password"
               name="password"
               required>

        <button type="submit">Login</button>

    </form>

    <!-- Error Messages -->
    <div class="thank-you-note">

        <p th:if="${param.error}" style="color:red;">
            Invalid email or password ❌
        </p>

        <p th:if="${param.logout}" style="color:green;">
            Logged out successfully ✅
        </p>

        <p>
            New user?
            <a href="/signup">Sign Up</a>
        </p>

    </div>

</div>

<script src="/theme.js"></script>

</body>
</html>
