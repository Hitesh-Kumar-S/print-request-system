<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Pending Requests</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

    <style>

        .container {
            width: 95%;
            max-width: 1300px;
            margin: 40px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ccc;
            text-align: center;
        }

        th {
            font-weight: 600;
        }

        .action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            margin: 5px;
            display: inline-block;
        }

    </style>

</head>
<body>

<button class="toggle-btn"
        onclick="toggleDarkMode()"
        id="toggle-icon">🌙</button>

<div class="container">

    <h2>⏳ Pending Print Requests</h2>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>User</th>
            <th>Document</th>
            <th>Pages</th>
            <th>Copies</th>
            <th>Amount</th>
            <th>Payment</th>
            <th>View</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="request : ${requests}">

            <td th:text="${request.id}"></td>

            <td th:text="${request.user.email}"></td>

            <td th:text="${request.documentName}"></td>

            <td th:text="${request.pages}"></td>

            <td th:text="${request.copies}"></td>

            <td th:text="${request.amount}"></td>

            <td th:text="${request.paymentStatus}"></td>

            <td>

                <a th:href="@{'/viewFile/' + ${request.id}}"
                   target="_blank">

                    📄 View
                </a>

            </td>

            <td>

                <!-- Approve -->
                <a th:href="@{'/admin/approve/' + ${request.id}}">
                    ✅ Approve
                </a>

                <br><br>

                <!-- Reject -->
                <a th:href="@{'/admin/reject/' + ${request.id}}">
                    ❌ Reject
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <br>

    <a th:href="@{/admin/dashboard}">
        ⬅ Back to Dashboard
    </a>

</div>

<script src="/theme.js"></script>

</body>
</html>
