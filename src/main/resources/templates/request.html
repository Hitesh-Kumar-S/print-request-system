<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Print Request Form</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">

    <!-- 🔐 Auth Check (VERY IMPORTANT) -->
    <script>
        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please login first!");
            window.location.href = "/login";
        }
    </script>
</head>
<body>

<!-- 🌙 Dark Mode Toggle Button -->
<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">
    <h2>🖨️ Print Request Form</h2>
    
    <div class="welcome-message">
        <p>Welcome! Please fill out the form below to make your print request.</p>
    </div>
    
    <form th:action="@{/submitRequest}" method="post" th:object="${printRequest}">
        
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Enter your name" required />

        <label for="documentName">Document Name</label>
        <input type="text" id="documentName" th:field="*{documentName}" placeholder="E.g., Resume.pdf" required />

        <label for="pages">Number of Pages</label>
        <input type="number" id="pages" th:field="*{pages}" min="1" placeholder="Enter number of pages" required />

        <label for="color">Color</label>
        <select id="color" th:field="*{color}">
            <option value="color">Color</option>
            <option value="bw">Black & White</option>
        </select>

        <label for="sided">Sided</label>
        <select id="sided" th:field="*{sided}">
            <option value="single">Single Side</option>
            <option value="double">Double Side</option>
        </select>

        <button type="submit">🚀 Submit Request</button>
    </form>

    <div class="time-display">
        <p id="current-date"></p>
        <p id="current-time"></p>
    </div>

    <div class="thank-you-note">
        <p>Thank you for using our Print Request Service!</p>
    </div>
</div>

<!-- 🔗 JS FILE -->
<script src="/theme.js"></script>

</body>
</html>
