<!DOCTYPE html>
<html>
<head>
    <title>Signup - Print App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Dark Mode Toggle -->
<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">

    <h2>🆕 Create Account</h2>

    <form id="signupForm">

        <label>Username</label>
        <input type="text" id="username" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Sign Up</button>

    </form>

    <!-- Message -->
    <p id="message" style="text-align:center; margin-top:10px;"></p>

    <div class="thank-you-note">
        <p>Already have an account?
            <a href="/login">Sign In</a>
        </p>
    </div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const messageEl = document.getElementById("message");

    // User object
    const user = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    try {

        const res = await fetch("/auth/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        });

        const message = await res.text();

        if (res.ok) {

            messageEl.style.color = "green";
            messageEl.innerText = message;

            // Redirect to login
            setTimeout(() => {
                window.location.href = "/login";
            }, 1500);

        } else {

            messageEl.style.color = "red";
            messageEl.innerText = message || "Signup failed ❌";
        }

    } catch (error) {

        messageEl.style.color = "red";
        messageEl.innerText = "Something went wrong ❌";
    }

});

</script>

<script src="/theme.js"></script>

</body>
</html>
