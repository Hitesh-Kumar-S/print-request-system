<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Signup - PrintFlow</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 45px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }
    </style>
</head>
<body>

<!-- Dark Mode Toggle -->
<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">

    <h2>Create Account</h2>

    <div class="info-box">
        Please use a valid Gmail account while creating your account.
        <br><br>
        All request updates, approval notifications,
        and print status messages will be sent
        to your registered email address.
    </div>

    <form th:action="@{/signup}" method="post" th:object="${user}">

        <label>Username</label>
        <input type="text" th:field="*{username}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Password</label>
<div class="password-wrapper">
    <input type="password" th:field="*{password}" id="password" required>
    <span class="toggle-password" id="togglePasswordText" onclick="togglePassword()">Show</span>
</div>

        <button type="submit">Sign Up</button>
    </form>

    <!-- Error Message -->
    <p th:if="${error}"
       th:text="${error}"
       style="color:red; text-align:center; margin-top:10px;"></p>

    <div class="thank-you-note">
        <p>Already have an account?
            <a href="/login">Sign In</a>
        </p>
    </div>

</div>

<!-- <script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        passwordField.type = passwordField.type === "password" ? "text" : "password";
    }
</script> -->

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleText = document.getElementById("togglePasswordText");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleText.textContent = "Hide";
        } else {
            passwordField.type = "password";
            toggleText.textContent = "Show";
        }
    }
</script>

<script src="/theme.js"></script>

</body>
</html>
