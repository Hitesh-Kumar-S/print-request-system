<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Print Request Summary</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 🌙 Dark Mode Toggle Button -->
<button class="toggle-btn" onclick="toggleDarkMode()" id="toggle-icon">🌙</button>

<div class="form-container">
    <h2>📄 Print Request Summary</h2>

    <div class="welcome-message">
        <p>Please review your request before proceeding</p>
    </div>

    <!-- 📋 Summary Table -->
    <table style="width:100%; margin-top:20px;">
        <tr>
            <td><strong>Name:</strong></td>
            <td th:text="${printRequest.name}">Name</td>
        </tr>

        <tr>
            <td><strong>Document Name:</strong></td>
            <td th:text="${printRequest.documentName}">Document</td>
        </tr>

        <tr>
            <td style="vertical-align: top;"><strong>Uploaded File:</strong></td>
            <td class="file-name" th:text="${printRequest.fileName}">File</td>
        </tr>

        <tr>
            <td><strong>Pages:</strong></td>
            <td th:text="${printRequest.pages}">0</td>
        </tr>

        <tr>
            <td><strong>Color:</strong></td>
            <td th:text="${printRequest.color}">bw</td>
        </tr>

        <tr>
            <td><strong>Sided:</strong></td>
            <td th:text="${printRequest.sided}">single</td>
        </tr>

        <tr>
            <td><strong>Amount:</strong></td>
            <td th:text="${printRequest.amount}">0.0</td>
        </tr>
    </table>

    <!-- 🔘 Buttons -->
    <div style="display:flex; justify-content:space-between; margin-top:30px;">
        
        <!-- Back -->
        <form th:action="@{/request}" method="get">
            <button type="submit">⬅ Back</button>
        </form>

        <!-- Proceed -->
        <form th:action="@{/confirmRequest}" method="post">

            <!-- 🔥 IMPORTANT: pass all data -->
            <input type="hidden" name="name" th:value="${printRequest.name}" />
            <input type="hidden" name="documentName" th:value="${printRequest.documentName}" />
            <input type="hidden" name="pages" th:value="${printRequest.pages}" />
            <input type="hidden" name="color" th:value="${printRequest.color}" />
            <input type="hidden" name="sided" th:value="${printRequest.sided}" />
            <input type="hidden" name="amount" th:value="${printRequest.amount}" />

            <!-- 🔥 NEW (VERY IMPORTANT) -->
            <input type="hidden" name="fileName" th:value="${printRequest.fileName}" />
            <input type="hidden" name="filePath" th:value="${printRequest.filePath}" />

            <button type="submit">✅ Proceed</button>
        </form>
    </div>

    <div class="time-display">
        <p id="current-date"></p>
        <p id="current-time"></p>
    </div>

    <div class="thank-you-note">
        <p>Make sure everything looks correct 👍</p>
    </div>
</div>

<!-- 🔗 JS -->
<script src="/theme.js"></script>

</body>
</html>
